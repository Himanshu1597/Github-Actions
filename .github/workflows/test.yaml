name: Test workflow

on:
  workflow_dispatch:

  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Test Step
        run: echo "This is the test workflow"

      - name: Print the current directory
        run: pwd
      - name: Print the current files in the current directory
        run: ls -la

      - name: Checkout the repository
        uses: actions/checkout@v3
        with:
          ref: main

      - name: Print the current files and folders
        run: ls -la